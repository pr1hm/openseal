<body class="bg-gray-50 min-h-screen font-sans flex flex-col items-center">
    
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 w-full px-8 py-4 flex justify-between items-center mb-8">
        <h1 class="text-2xl font-black text-blue-900 tracking-tight">OpenSeal.</h1>
        <a href="/" class="text-gray-500 hover:text-gray-900 font-medium transition">
            &larr; Back to Dashboard
        </a>
    </nav>

    <!-- Upload Section -->
    <div id="upload-section" class="mt-10 p-8 bg-white shadow-lg rounded-xl border border-gray-200 w-full max-w-md text-center">
      <div class="mb-6">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <h3 class="mt-2 text-lg font-bold text-gray-900">Upload a Document</h3>
        <p class="text-sm text-gray-500">Must be a PDF file.</p>
      </div>
      <input type="file" id="pdf-upload" accept="application/pdf" class="mb-6 w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
      <button onclick="uploadedDocument()" class="bg-blue-600 text-white font-bold px-4 py-3 rounded-lg shadow hover:bg-blue-700 w-full transition">
        Upload and Continue
      </button>
    </div>

    <!-- Workspace Section -->
    <div id="workspace" class="hidden flex-col items-center w-full max-w-5xl px-4 pb-12">
      
      <!-- Top Bar: Coordinates & Pagination -->
      <div class="w-full flex justify-between items-center bg-white p-4 rounded-t-xl border border-gray-200 shadow-sm mb-4">
        <p class="text-sm font-medium text-gray-500">Box Coordinates: <span id="coords" class="text-gray-900 font-mono">X: 50, Y: 50</span></p>
        
        <div id="pagination-controls" class="flex gap-4 items-center">
          <button id="prev-page" class="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded hover:bg-gray-200 transition">Previous</button>
          <span id="page-info" class="text-sm font-bold text-gray-800">Page 1</span>
          <button id="next-page" class="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded hover:bg-gray-200 transition">Next</button>
        </div>
      </div>

      <!-- PDF Canvas Area -->
      <div id="pdf-container" class="relative shadow-2xl bg-white border border-gray-300 inline-block overflow-hidden rounded-b-xl">
        <canvas id="pdf-render"></canvas>
        <div id="sig-box" class="absolute top-12 left-12 w-36 h-12 border-2 border-dashed border-red-500 bg-red-500/20 cursor-grab flex items-center justify-center font-bold text-red-600 select-none z-10" style="resize: both; overflow: hidden; min-width: 80px; min-height: 40px;">
          Sign Here
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="generateLink()" class="mt-8 bg-green-600 text-white text-lg font-bold px-8 py-4 rounded-xl shadow-lg hover:bg-green-700 hover:shadow-xl transition transform hover:-translate-y-1">
        Generate Signature Link
      </button>
    </div>

    <script src="/static/admin.js"></script>
  </body>
