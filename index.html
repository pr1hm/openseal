<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSeal Prototype</title>
    <!-- Load vanilla PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <h2>Admin View: Drag the Signature Box</h2>
    <p>Coordinates: <span id="coords">X: 50, Y: 50</span></p>

    <div id="pdf-container">
        <!-- The PDF renders here -->
        <canvas id="pdf-render"></canvas>
        <!-- The draggable box -->
        <div id="sig-box">Sign Here</div>
    </div>
    <div id="sig-pad-container">
        <h2>Signer View: Draw Your Signature</h2>
        <canvas id="sig-canvas" width="400" height="150"></canvas>
        <div>
            <button onclick="clearCanvas()">Clear</button>
            <button onclick="stampDocument()">Save & Stamp Document</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
