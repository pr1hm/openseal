<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/gif" href="/static/favicon.gif">
    <title>OpenSeal - Sign Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center p-4 md:p-8 min-h-screen font-sans">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 tracking-tight" id="status-text">Review and Sign Document</h2>

    <div id="pdf-container" style="position: relative; display: inline-block;" class="max-w-full overflow-hidden rounded-xl shadow border border-gray-200">
        <canvas id="pdf-render" class="bg-white max-w-full"></canvas>
        <button id="target-box" onclick="openModal()" class="absolute border-2 border-dashed border-blue-500 bg-yellow-200 hover:bg-yellow-50 transition flex items-center justify-center font-bold text-green-500 shadow-sm rounded backdrop-blur-sm z-10" style="display: none;">Click to Sign</button>
    </div>

    <div id="success-screen" class="hidden mt-8 flex-col items-center bg-yellow-50 p-8 rounded-2xl border border-blue-200 shadow-sm text-center max-w-md w-full">
        <div class="text-green-500 mb-4 bg-yellow-100 p-4 rounded-full">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 class="text-2xl font-black text-black mb-2">Document Signed!</h3>
        <p class="text-black mb-8 font-medium">Your signature has been securely applied.</p>
        <a id="download-btn" href="#" target="_blank" class="group bg-black border-2 border-white text-white font-bold py-3 px-6 rounded-xl shadow-md hover:bg-white hover:border-black transition transform duration-300 w-full"><span class="group-hover:text-blue-500 transition-colors">Download </span><span class="group-hover:text-yellow-400 transition-colors">Your </span><span class="group-hover:text-green-500 transition-colors">Copy</span></a>
    </div>

    <div id="signature-modal" class="fixed inset-0 bg-black/60 hidden flex-col items-center justify-center z-50 px-4 backdrop-blur-sm">
        <div class="bg-white border-4 border-yellow-500 p-6 rounded-2xl shadow-2xl flex flex-col items-center w-full max-w-lg">
            <div class="w-full flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold underline underline-offset-4 text-gray-900">Draw Your Signature</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <div class="border-2 border-blue-500 rounded- bg-gray-50 overflow-hidden w-full touch-none shadow-inner">
                <canvas id="sig-canvas" class="w-full cursor-crosshair"></canvas>
            </div>

            <div class="mt-6 gap-4 flex w-full">
                <button class="bg-white border-2 border-red-600 text-gray-800 font-bold px-4 py-3 rounded-xl hover:text-white hover:bg-red-300 w-1/3 transition" onclick="clearCanvas()">Clear</button>
                <button id="submit-btn" class="bg-green-500 border-2 border-black text-black font-bold px-4 py-3 rounded-xl shadow hover:bg-green-800 hover:text-white w-2/3 transition" onclick="submitSignature()">Apply Signature</button>
            </div>
        </div>
    </div>

    <script src="/static/signer.js"></script>
</body>
</html>
