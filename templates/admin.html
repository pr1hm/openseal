<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/gif" href="/static/favicon.gif">
    <title>OpenSeal Prototype</title>
    <!-- Load vanilla PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen font-sans flex flex-col items-center">
    <nav
      class="bg-white shadow-sm border-b border-gray-200 w-full px-8 py-4 flex justify-between items-center mb-8"
    >
      <h1 class="text-2xl font-black text-black tracking-tight">OpenSeal.</h1>
      <a
        href="/"
        class="text-black hover:underline underline-offset-4 font-medium transition"
      >
        &larr; Back to Dashboard
      </a>
    </nav>

    <div
      id="upload-section"
      class="mt-10 p-8 bg-white shadow-lg rounded-xl border border-gray-200 w-full max-w-md text-center"
    >
      <div class="mb-6">
        <img
          src="/static/upload.gif"
          alt="Loading animation"
          class="mx-auto h-12 w-12"
        />
        <h3 class="mt-2 text-lg font-bold text-gray-900">Upload a Document</h3>
        <p class="text-sm text-gray-500">Must be a PDF file.</p>
      </div>
      <input
        type="file"
        id="pdf-upload"
        accept="application/pdf"
        class="mb-6 w-full text-sm text-black file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-white file:border file:border-2 file:border-black file:text-black hover:file:bg-black hover:file:text-white"
      />
      <button
        onclick="uploadedDocument()"
        class="group bg-white hover:bg-black hover:text-white border border-2 border-black hover:border-white font-medium py-2 px-5 rounded-lg shadow-sm transition-all duration-300"
      >
        <span class="text-blue-500 group-hover:text-white transition-colors">Upload</span> <span class="text-yellow-500 group-hover:text-white transition-colors">and</span> <span class="text-green-500 group-hover:text-white transition-colors">Continue</span>
      </button>
    </div>

    <div
      id="workspace"
      class="hidden flex-col items-center w-full max-w-5xl px-4 pb-12"
    >
      <div
        class="w-full flex justify-between items-center bg-white p-4 rounded-t-xl border border-gray-200 shadow-sm mb-4"
      >
        <p class="text-sm font-medium text-gray-500">
          Box Coordinates:
          <span id="coords" class="text-gray-900 font-mono">X: 50, Y: 50</span>
        </p>

        <div id="pagination-controls" class="flex gap-4 items-center">
          <button
            id="prev-page"
            class="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded hover:bg-gray-200 transition"
          >
            	&larr;
          </button>
          <span id="page-info" class="text-sm font-bold text-gray-800"
            >Page 1</span
          >
          <button
            id="next-page"
            class="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded hover:bg-gray-200 transition"
          >
            &rarr;
          </button>
        </div>
      </div>

      <div
        id="pdf-container"
        class="relative shadow-2xl bg-white border border-gray-300 inline-block overflow-hidden rounded-b-xl"
      >
        <canvas id="pdf-render"></canvas>
        <div
          id="sig-box"
          class="group absolute top-12 left-12 w-36 h-12 border-2 border-dashed border-blue-500 cursor-grab flex items-center justify-center font-bold text-green-600 select-none z-10"
        >
          Sign Here
        </div>
      </div>

      <button
        onclick="generateLink()"
        class="group mt-8 bg-black border border-2 border-white text-white text-lg font-bold px-8 py-4 rounded-xl shadow-lg hover:bg-white hover:shadow-xl transition transform duration-300 hover:border-black hover:border-dotted"
      >
        <span class="group-hover:text-blue-500 transition-colors">Generate</span>  <span class="group-hover:text-yellow-500 transition-colors">Signature</span>  <span class="group-hover:text-green-500 transition-colors">Link</span>
      </button>
    </div>

    <script src="/static/admin.js"></script>
  </body>
</html>
