<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSeal Prototype</title>
    <!-- Load vanilla PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <h2>Admin View: Drag the Signature Box</h2>
    <p>Coordinates: <span id="coords">X: 50, Y: 50</span></p>

    <div id="pagination-controls">
        <button id="prev-page" class="bg-gray-200 px-4 py-2 rounded shadow hover:bg-gray-300">Previous</button>
        <span id="page-info" class="font-bold">Page 1</span>
        <button id="next-page" class="bg-gray-200 px-4 py-2 rounded shadow hover:bg-gray-300">Next</button>
    </div>
    <div id="pdf-container">
        <!-- The PDF renders here -->
        <canvas id="pdf-render"></canvas>
        <!-- The draggable box -->
        <div id="sig-box">Sign Here</div>
    </div>
    <div>
        <button onclick="generateLink()">Save & Stamp Document</button>
    </div>
    <script src="/static/admin.js"></script>
</body>
</html>
