<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/gif" href="/static/favicon.gif">
    <title>OpenSeal Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-black text-black tracking-tight">OpenSeal.</h1>
        <a href="/new-request" class="bg-white hover:bg-black text-black hover:text-white border border-2 border-black hover:border-white font-medium py-2 px-5 rounded-lg shadow-sm transition-all">
            + New Request
        </a>
    </nav>

    <main class="max-w-6xl mx-auto px-8 py-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-black">
                <p class="text-sm text-gray-500 underline underline-offset-4 decoration-2 decoration-blue-500 font-medium uppercase tracking-wider">Total Documents</p>
                <p class="text-4xl font-bold text-blue-500 mt-2" id="stat-total">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-black">
                <p class="text-sm text-gray-500 underline underline-offset-4 decoration-2 decoration-yellow-500 font-medium uppercase tracking-wider">Pending Signatures</p>
                <p class="text-4xl font-bold text-yellow-500 mt-2" id="stat-pending">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-black">
                <p class="text-sm text-gray-500 underline underline-offset-4 decoration-2 decoration-green-500 font-medium uppercase tracking-wider">Completed</p>
                <p class="text-4xl font-bold text-green-500 mt-2" id="stat-completed">0</p>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-black overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-black border-b border-gray-200 text-sm text-white underline underline-offset-4 uppercase tracking-wider">
                        <th class="p-5 font-medium">Document</th>
                        <th class="p-5 font-medium">Date Created</th>
                        <th class="p-5 font-medium">Status</th>
                        <th class="p-5 font-medium">Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-100 text-gray-700">
                    <!-- Work for JS -->
                </tbody>
            </table>
        </div>
    </main>
    
    <script src="/static/dashboard.js"></script>
</body>
</html>
